# Web tinh three.js, khong build. CI chi kiem cu phap + lien ket module; kiem khoi dong bang Edge chi chay tren may (scripts/ci.ps1).
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-modules.mjs
